name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-package:
    name: Validate And Package Extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: |
          python -m py_compile MotionScoreHRpQCT/MotionScoreHRpQCT.py

      - name: Validate extension metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required_files = [
              Path("CMakeLists.txt"),
              Path("SlicerMotionScoreHRpQCT.json"),
              Path("MotionScoreHRpQCT/CMakeLists.txt"),
              Path("MotionScoreHRpQCT/MotionScoreHRpQCT.py"),
          ]

          for path in required_files:
              if not path.exists():
                  raise SystemExit(f"Missing required file: {path}")

          meta = json.loads(Path("SlicerMotionScoreHRpQCT.json").read_text(encoding="utf-8"))
          required_keys = [
              "$schema",
              "category",
              "scm_url",
          ]
          missing = [key for key in required_keys if key not in meta]
          if missing:
              raise SystemExit(f"Missing required metadata keys: {missing}")

          print("Metadata validation passed.")
          PY

      - name: Build extension archive artifact
        run: |
          mkdir -p dist
          zip -r "dist/SlicerMotionScoreHRpQCT-${GITHUB_SHA::7}.zip" \
            CMakeLists.txt \
            SlicerMotionScoreHRpQCT.json \
            MotionScoreHRpQCT \
            resources \
            README.md \
            .gitignore \
            -x "*/__pycache__/*"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: slicer-extension-package
          path: dist/*.zip
