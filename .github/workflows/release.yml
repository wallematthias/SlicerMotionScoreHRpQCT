name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build And Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: |
          python -m py_compile MotionScoreHRpQCT/MotionScoreHRpQCT.py

      - name: Build extension package
        run: |
          mkdir -p dist
          PACKAGE_NAME="SlicerMotionScoreHRpQCT-${GITHUB_REF_NAME}.zip"
          zip -r "dist/${PACKAGE_NAME}" \
            CMakeLists.txt \
            SlicerMotionScoreHRpQCT.json \
            MotionScoreHRpQCT \
            resources \
            README.md \
            .gitignore \
            -x "*/__pycache__/*"
          sha256sum "dist/${PACKAGE_NAME}" > "dist/${PACKAGE_NAME}.sha256"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
